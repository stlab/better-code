[book]
authors = ["Sean Parent"]
language = "en"
src = "src"
title = "Better Code"
description = "A principled and rigorous approach to software development"

[build]
build-dir = "book"

[output.html]
git-repository-url = "https://github.com/stlab/better-code"
edit-url-template = "https://github.com/stlab/better-code/edit/main/better-code/{path}"
site-url = "/better-code/"

[output.html.search]
enable = true

[output.html.print]
enable = true

[output.html.code.hidelines]
swift = "#"

[preprocessor.katex]

# Tests all Swift code blocks during `mdbook build`
# supported-platforms: Only run on these platforms (python3 sys.platform values); omitted => run on all
[output.swift-test]
command = "python3 ../../../scripts/mdbook-swift-test.py"
# win32: runs when swiftc is on PATH; otherwise the script skips (e.g. GitHub Actions windows-latest)
supported-platforms = ["linux", "darwin", "win32"]
