name: Build mdBook

on:
  workflow_call:
    inputs:
      run-swift-tests:
        description: "Run the swift-test backend (HTML lands under book/html/)"
        type: boolean
        default: true
    outputs:
      artifact-path:
        description: "Path to the built book artifact"
        value: ${{ jobs.build.outputs.artifact-path }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-path: ${{ inputs.run-swift-tests && './better-code/book/html' || './better-code/book' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Cache Rust toolchain and cargo registry
      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-${{ hashFiles('versions.txt') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install mdBook and plugins
        run: |
          chmod +x scripts/install-tools.sh
          ./scripts/install-tools.sh

      - name: Configure HTML-only build
        if: ${{ !inputs.run-swift-tests }}
        working-directory: better-code
        run: sed -i '/^# Tests all Swift code blocks/,$d' book.toml

      - name: Setup Swift
        if: inputs.run-swift-tests
        uses: swift-actions/setup-swift@v2

      - name: Build with mdBook
        run: mdbook build ./better-code

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdbook-build-ubuntu-latest
          path: ${{ inputs.run-swift-tests && './better-code/book/html' || './better-code/book' }}
          retention-days: 1
